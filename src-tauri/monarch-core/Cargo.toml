[package]
name = "monarch-core"
version = "0.5.0-alpha"
edition = "2021"
license = "MIT"
description = "Shared MonARCH Store domain and catalog services"

[dependencies]
alpm = "5.0"
appstream = { version = "0.2.2", features = ["gzip"] }
base64 = "0.22.1"
chrono = "0.4.43"
dirs = "6.0.0"
feed-rs = "2.3.1"
futures = "0.3.31"
log = "0.4"
once_cell = "1.21.3"
num_cpus = "1.17.0"
raur = "8.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "http2", "charset"] }
roxmltree = "0.20.0"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.23.0"
tokio = { version = "1", features = ["full"] }
