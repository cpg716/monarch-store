[package]
name = "monarch-gtk"
version = "0.5.0-alpha"
edition = "2021"
license = "MIT"
description = "GTK4 + Libadwaita frontend for MonARCH Store"

[dependencies]
ashpd = "0.10"
base64 = "0.22"
env_logger = "0.11"
gdk-pixbuf = "0.20"
gio = "0.20"
glib = "0.20"
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
log = "0.4"
monarch-core = { path = "../monarch-core" }
once_cell = "1.21.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
serde_json = "1"
