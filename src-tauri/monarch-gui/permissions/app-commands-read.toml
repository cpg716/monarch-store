# Read-only and non-privileged commands: search, queries, status, cache clear (user dir), telemetry, launch.
# Windows with only this capability cannot install/remove packages or run repair/Polkit actions.
[[permission]]
identifier = "app-commands-read"
description = "Read-only and non-privileged app commands (search, metadata, status, user cache, telemetry)"
commands.allow = [
    "check_and_clear_refresh_requested",
    "check_app_update",
    "check_chaotic_status",
    "check_initialization_status",
    "check_installed_status",
    "check_keyring_health",
    "check_pacman_lock",
