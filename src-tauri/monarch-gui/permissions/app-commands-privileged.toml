# Commands that invoke the helper (Polkit/sudo), change system/repo state, or perform privileged repair.
# Only grant to windows that need install/update/repair/settings-write.
[[permission]]
identifier = "app-commands-privileged"
description = "Privileged and state-changing commands (install, uninstall, repair, sync, policy, repo/settings write)"
commands.allow = [
    "abort_installation",
    "apply_os_config",
    "apply_updates",
    "cancel_install",
    "clear_pacman_package_cache",
    "fix_keyring_issues",
    "fix_keyring_issues_alias",
    "force_refresh_databases",
    "install_monarch_policy",
    "install_package",
    "optimize_system",
    "perform_system_update",
    "prepare_chaotic_components",
    "prepare_flatpak",
    "ensure_flathub_remote",
    "rank_mirrors",
    "remove_orphans",
    "repair_emergency_sync",
    "repair_reset_keyring",
    "repair_unlock_pacman",
    "set_advanced_mode",
    "set_aur_enabled",
    "set_notifications_enabled",
    "set_one_click_enabled",
    "set_parallel_downloads",
    "set_sync_on_startup_enabled",
    "set_telemetry_enabled",
    "sync_system_databases",
    "toggle_repo",
    "toggle_repo_family",
    "uninstall_package",
    "unlock_pacman_if_stale",
    "update_and_install_package",
]
