# Release: build GTK-only MonARCH Store (monarch-gtk) and publish draft release.
# Build runs in Arch container; publish runs on host so gh has access to .git.
name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GTK/libadwaita, libalpm, and build dependencies (Arch)
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel \
            rustup \
            pkgconf \
            libadwaita \
            gtk4 \
            webkit2gtk-4.1 \
            librsvg \
            pacman \
            github-cli \
            git \
            libarchive \
            curl \
            gpgme \
            openssl \
            sqlite \
            clang \
            lld
          # Ensure cargo/rustc are available via rustup inside the container.
          rustup default stable
          export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/lib64/pkgconfig:/usr/share/pkgconfig"
          echo "pkg-config version: $(pkg-config --version || echo 'unknown')"
          echo "libadwaita version: $(pkg-config --modversion libadwaita-1 || echo 'unknown')"
          echo "gtk4 version: $(pkg-config --modversion gtk4 || echo 'unknown')"
          echo "libalpm pc dir: $(pkg-config --variable=pcfiledir libalpm 2>/dev/null || echo 'unknown')"
          echo "libalpm version: $(pkg-config --modversion libalpm || true)"
          pkg-config --exists 'libadwaita-1 >= 1.4' && echo "libadwaita-1 >= 1.4 OK" || pkg-config --print-errors 'libadwaita-1 >= 1.4'
          pkg-config --exists gtk4 && echo "gtk4 OK" || pkg-config --print-errors gtk4
          pkg-config --print-errors --exists libalpm || (echo "pkg-config cannot resolve libalpm; dumping errors:"; pkg-config --print-errors libalpm; exit 1)
          echo "libalpm cflags: $(pkg-config --cflags libalpm || echo 'unknown')"
          echo "libalpm libs: $(pkg-config --libs libalpm || echo 'unknown')"

      - name: Build monarch-helper
        run: |
          cd src-tauri
          cargo build --release -p monarch-helper

      - name: Build monarch-gtk
        run: |
          cd src-tauri
          cargo build --release -p monarch-gtk

      - name: Create release tarball
        run: |
          TAG="${{ github.ref_name }}"
          PREFIX="monarch-store-${TAG}-linux-x86_64"
          mkdir -p "$PREFIX/usr/bin" "$PREFIX/usr/share/applications" "$PREFIX/usr/share/metainfo" \
            "$PREFIX/usr/share/icons/hicolor/128x128/apps" "$PREFIX/usr/share/icons/hicolor/32x32/apps" \
            "$PREFIX/usr/share/icons/hicolor/64x64/apps" "$PREFIX/usr/share/icons/hicolor/512x512/apps" \
            "$PREFIX/usr/share/polkit-1/actions" "$PREFIX/usr/share/polkit-1/rules.d" \
            "$PREFIX/usr/lib/monarch-store" "$PREFIX/usr/share/licenses/monarch-store"
          install -m755 src-tauri/target/release/monarch-gtk "$PREFIX/usr/bin/monarch-store"
          install -m755 src-tauri/target/release/monarch-helper "$PREFIX/usr/lib/monarch-store/monarch-helper"
          [ -f src-tauri/scripts/monarch-wrapper ] && install -m755 src-tauri/scripts/monarch-wrapper "$PREFIX/usr/lib/monarch-store/monarch-wrapper"
          install -m644 src-tauri/monarch-store.desktop "$PREFIX/usr/share/applications/"
          install -m644 src-tauri/monarch-store.metainfo.xml "$PREFIX/usr/share/metainfo/"
          install -m644 src-tauri/monarch-gui/icons/128x128.png "$PREFIX/usr/share/icons/hicolor/128x128/apps/monarch-store.png" 2>/dev/null || true
          install -m644 src-tauri/monarch-gui/icons/32x32.png "$PREFIX/usr/share/icons/hicolor/32x32/apps/monarch-store.png" 2>/dev/null || true
          install -m644 src-tauri/monarch-gui/icons/64x64.png "$PREFIX/usr/share/icons/hicolor/64x64/apps/monarch-store.png" 2>/dev/null || true
          install -m644 src-tauri/monarch-gui/icons/icon.png "$PREFIX/usr/share/icons/hicolor/512x512/apps/monarch-store.png" 2>/dev/null || true
          install -m644 src-tauri/monarch-gui/com.monarch.store.policy "$PREFIX/usr/share/polkit-1/actions/" 2>/dev/null || true
          [ -d src-tauri/rules ] && install -m644 src-tauri/rules/10-monarch-store.rules "$PREFIX/usr/share/polkit-1/rules.d/" 2>/dev/null || true
          install -m644 LICENSE "$PREFIX/usr/share/licenses/monarch-store/LICENSE"
          tar czf "${PREFIX}.tar.gz" "$PREFIX"
          echo "tarball=${PREFIX}.tar.gz" >> $GITHUB_ENV

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: ${{ env.tarball }}

  publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball

      - name: Create draft release and upload tarball
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          tarball=$(find . -maxdepth 2 -name '*.tar.gz' | head -1)
          if section=$(awk -v tag="$TAG" '/^## / { if (found) exit; if ($0 ~ tag) found=1 } found { print }' RELEASE_NOTES.md) && [ -n "$section" ]; then
            body="Release **${TAG}**

          ${section}

          See assets below for installation."
          else
            body="Release **${TAG}**. See assets below for installation."
          fi
          echo "$body" > /tmp/release_notes.md
          gh release create "$TAG" --draft --title "MonARCH Store $TAG" --notes-file /tmp/release_notes.md --prerelease 2>/dev/null || true
          gh release upload "$TAG" "$tarball" --clobber
          echo "Draft release created/updated: $TAG"