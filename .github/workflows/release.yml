name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04] # Focused on Linux for now as it's an Arch store

    runs-on: ${{ matrix.platform }}
    container:
      image: ghcr.io/cpg716/monarch-store-builder:latest
      options: --user root # Ensure we have permission to install if needed, though mostly pre-installed

    steps:
      - uses: actions/checkout@v4
      
      # Fix git safe directory issue in container
      - name: Git Safe Directory
        run: git config --global --add safe.directory /__w/monarch-store/monarch-store

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: install Rust stable
        run: rustup default stable 

      - name: install system dependencies
        run: apt-get update && apt-get install -y xdg-utils 

      - name: install frontend dependencies
        run: npm install

      - name: build frontend
        run: npm run build
      
      - name: build monarch-helper
        run: |
          cd src-tauri
          # Container has PKG_CONFIG_PATH set in Dockerfile ENV, so this just works
          cargo build --release -p monarch-helper

      - name: disable tauri build hook
        run: |
          sed -i 's/npm run build/true/' src-tauri/monarch-gui/tauri.conf.json

      - name: Prepare release body
        id: release_body
        run: |
          TAG="${{ github.ref_name }}"
          # Extract section for this tag from RELEASE_NOTES.md (from "## TAG" until next "## ")
          if section=$(awk -v tag="$TAG" '/^## / { if (found) exit; if ($0 ~ tag) found=1 } found { print }' RELEASE_NOTES.md) && [ -n "$section" ]; then
            body="Release **${TAG}**

          ${section}

          See assets below for installation."
          else
            body="Release **${TAG}**. See assets below for installation."
          fi
          delimiter="release_body_$(date +%s)"
          echo "body<<${delimiter}" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Pass hardened environment variables into the action sub-shell
          RUSTFLAGS: ""
        with:
          projectPath: './src-tauri/monarch-gui'
          args: --verbose
          tagName: ${{ github.ref_name }}
          releaseName: 'MonARCH Store ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: true
          prerelease: true
